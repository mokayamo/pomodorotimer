<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポモドーロタイマー</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">ポモドーロタイマー</h1>
            <div class="mode-indicator">
                <div id="mode-text" class="mode-text">作業中</div>
                <div class="mode-circle"></div>
            </div>
        </header>
        
        <main class="main-content">
            <div class="timer-display">
                <div id="time-display" class="time-text">25:00</div>
                <div class="time-circle"></div>
            </div>
            
            <div class="controls">
                <button id="start-btn" class="control-btn start-btn">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <span>開始</span>
                </button>
                <button id="reset-btn" class="control-btn reset-btn">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    <span>リセット</span>
                </button>
            </div>
        </main>

        <footer class="footer">
            <div class="settings">
                <div class="setting-item">
                    <label for="work-time" class="setting-label">作業時間</label>
                    <div class="input-container">
                        <input type="number" id="work-time" value="25" min="1" max="120">
                        <span class="unit">分</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label for="break-time" class="setting-label">休憩時間</label>
                    <div class="input-container">
                        <input type="number" id="break-time" value="5" min="1" max="30">
                        <span class="unit">分</span>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
